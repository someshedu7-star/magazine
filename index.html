<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Small Actions, Big Change</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --desk: #171717;
      --desk-light: #252525;
      --page-edge: rgba(0, 0, 0, 0.18);
      --gold: #c8a44d;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.08), transparent 34%),
        linear-gradient(135deg, var(--desk-light), var(--desk));
      user-select: none;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
    }

    .reader {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(10px, 2.4vw, 30px);
      touch-action: none;
      cursor: grab;
    }

    .reader:active {
      cursor: grabbing;
    }

    .book {
      position: relative;
      width: min(96vw, calc(94vh * 1.42));
      height: min(94vh, calc(96vw / 1.42));
      display: grid;
      grid-template-columns: 1fr 1fr;
      perspective: 2200px;
      filter: drop-shadow(0 34px 34px rgba(0, 0, 0, 0.52));
    }

    .book.single {
      width: min(96vw, calc(94vh * 0.71));
      height: min(94vh, calc(96vw / 0.71));
      grid-template-columns: 1fr;
    }

    .page {
      position: relative;
      overflow: hidden;
      background: #fff;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .page.left {
      border-radius: 6px 0 0 6px;
      box-shadow:
        inset -18px 0 30px rgba(0, 0, 0, 0.14),
        inset 0 0 0 1px var(--page-edge);
    }

    .page.right {
      border-radius: 0 6px 6px 0;
      box-shadow:
        inset 18px 0 30px rgba(0, 0, 0, 0.13),
        inset 0 0 0 1px var(--page-edge);
    }

    .book.single .page {
      border-radius: 6px;
      box-shadow: inset 0 0 0 1px var(--page-edge);
    }

    .book.single .page.left {
      display: none;
    }

    .book.single .turn {
      width: 100%;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
      object-fit: contain;
    }

    .spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      z-index: 3;
      width: 28px;
      pointer-events: none;
      transform: translateX(-50%);
      background: linear-gradient(
        90deg,
        rgba(0, 0, 0, 0),
        rgba(0, 0, 0, 0.18),
        rgba(255, 255, 255, 0.2),
        rgba(0, 0, 0, 0.16),
        rgba(0, 0, 0, 0)
      );
      opacity: 0.82;
    }

    .book.single .spine {
      display: none;
    }

    .turn {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 8;
      overflow: hidden;
      pointer-events: none;
      background: #fff;
      opacity: 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      will-change: transform, opacity;
    }

    .turn.right {
      right: 0;
      transform-origin: left center;
      border-radius: 0 6px 6px 0;
      box-shadow: inset 18px 0 32px rgba(0, 0, 0, 0.16);
    }

    .turn.left {
      left: 0;
      transform-origin: right center;
      border-radius: 6px 0 0 6px;
      box-shadow: inset -18px 0 32px rgba(0, 0, 0, 0.16);
    }

    .turn img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .turn.next {
      animation: nextPage 520ms cubic-bezier(0.4, 0, 0.18, 1);
    }

    .turn.prev {
      animation: prevPage 520ms cubic-bezier(0.4, 0, 0.18, 1);
    }

    .credit {
      position: fixed;
      right: 14px;
      bottom: 10px;
      z-index: 15;
      color: rgba(255, 255, 255, 0.62);
      font: 600 11px/1 Arial, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      color: #fff;
      background: #171717;
      font: 700 13px/1 Arial, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
    }

    @keyframes nextPage {
      0% {
        opacity: 1;
        transform: rotateY(0deg);
      }
      100% {
        opacity: 1;
        transform: rotateY(-178deg);
      }
    }

    @keyframes prevPage {
      0% {
        opacity: 1;
        transform: rotateY(0deg);
      }
      100% {
        opacity: 1;
        transform: rotateY(178deg);
      }
    }

    @media (max-width: 720px), (orientation: portrait) {
      .book {
        width: min(96vw, calc(94vh * 0.71));
        height: min(94vh, calc(96vw / 0.71));
        grid-template-columns: 1fr;
      }

      .page.left,
      .spine {
        display: none;
      }

      .page.right {
        border-radius: 6px;
      }

      .turn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="reader" id="reader" aria-label="Magazine flipbook">
    <section class="book" id="book">
      <div class="page left"><canvas id="leftCanvas"></canvas></div>
      <div class="page right"><canvas id="rightCanvas"></canvas></div>
      <div class="spine"></div>
      <div class="turn right" id="turnRight"></div>
      <div class="turn left" id="turnLeft"></div>
    </section>
  </main>
  <div class="credit">someshbali</div>
  <div class="loader" id="loader">Opening Magazine</div>

  <script>
    const PDF_FILE = "Flyer - Small Actions, Big Change.pdf";
    const RENDER_SCALE = 2.15;
    const CACHE_RADIUS = 6;

    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const reader = document.getElementById("reader");
    const book = document.getElementById("book");
    const leftCanvas = document.getElementById("leftCanvas");
    const rightCanvas = document.getElementById("rightCanvas");
    const turnRight = document.getElementById("turnRight");
    const turnLeft = document.getElementById("turnLeft");
    const loader = document.getElementById("loader");

    let pdfDoc = null;
    let currentPage = 1;
    let isTurning = false;
    let startX = 0;
    let startY = 0;
    let cache = new Map();
    let compact = isCompact();

    function isCompact() {
      return window.matchMedia("(max-width: 720px), (orientation: portrait)").matches;
    }

    function spreadPages(page = currentPage) {
      if (!pdfDoc) return [];
      if (compact || page === 1 || page === pdfDoc.numPages) return [page];
      const left = page % 2 === 0 ? page : page - 1;
      return [left, Math.min(left + 1, pdfDoc.numPages)];
    }

    function pageStep() {
      return compact ? 1 : 2;
    }

    function targetPage(page) {
      return Math.max(1, Math.min(page, pdfDoc.numPages));
    }

    async function renderToCanvas(pageNumber, canvas) {
      if (!pdfDoc || pageNumber < 1 || pageNumber > pdfDoc.numPages) {
        canvas.style.visibility = "hidden";
        return;
      }

      const image = await getPageImage(pageNumber);
      const context = canvas.getContext("2d");
      const ratio = window.devicePixelRatio || 1;
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;

      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      canvas.style.visibility = "visible";
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);
      context.fillStyle = "#ffffff";
      context.fillRect(0, 0, width, height);

      const fit = Math.min(width / image.width, height / image.height);
      const drawWidth = image.width * fit;
      const drawHeight = image.height * fit;
      const x = (width - drawWidth) / 2;
      const y = (height - drawHeight) / 2;
      context.drawImage(image, x, y, drawWidth, drawHeight);
    }

    async function getPageImage(pageNumber) {
      if (cache.has(pageNumber)) return cache.get(pageNumber);

      const page = await pdfDoc.getPage(pageNumber);
      const viewport = page.getViewport({ scale: RENDER_SCALE });
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d", { alpha: false });

      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      await page.render({ canvasContext: context, viewport }).promise;

      const image = new Image();
      image.src = canvas.toDataURL("image/jpeg", 0.92);
      await image.decode();
      cache.set(pageNumber, image);
      trimCache();
      return image;
    }

    function trimCache() {
      const keep = new Set();
      for (let i = currentPage - CACHE_RADIUS; i <= currentPage + CACHE_RADIUS; i += 1) {
        if (i >= 1 && pdfDoc && i <= pdfDoc.numPages) keep.add(i);
      }
      cache.forEach((_, key) => {
        if (!keep.has(key)) cache.delete(key);
      });
    }

    async function renderBook() {
      const pages = spreadPages();
      book.classList.toggle("single", pages.length === 1);

      if (pages.length === 1) {
        await renderToCanvas(0, leftCanvas);
        await renderToCanvas(pages[0], rightCanvas);
      } else {
        await Promise.all([
          renderToCanvas(pages[0], leftCanvas),
          renderToCanvas(pages[1], rightCanvas)
        ]);
      }

      warmCache();
    }

    function warmCache() {
      if (!pdfDoc) return;
      const queue = [];
      for (let i = currentPage - CACHE_RADIUS; i <= currentPage + CACHE_RADIUS; i += 1) {
        if (i >= 1 && i <= pdfDoc.numPages && !cache.has(i)) queue.push(i);
      }
      queue.reduce((chain, pageNumber) => chain.then(() => getPageImage(pageNumber).catch(() => null)), Promise.resolve());
    }

    function snapshotTurn(direction) {
      const pages = spreadPages();
      const source = direction === "next" || pages.length === 1 ? rightCanvas : leftCanvas;
      const target = direction === "next" ? turnRight : turnLeft;
      target.innerHTML = "";

      if (source.style.visibility === "hidden") return target;
      const image = new Image();
      image.src = source.toDataURL("image/jpeg", 0.92);
      target.appendChild(image);
      return target;
    }

    async function turn(direction) {
      if (!pdfDoc || isTurning) return;

      const nextPage = direction === "next"
        ? targetPage(currentPage + pageStep())
        : targetPage(currentPage - pageStep());

      if (nextPage === currentPage) return;
      isTurning = true;

      const sheet = snapshotTurn(direction);
      sheet.classList.remove("next", "prev");
      void sheet.offsetWidth;
      sheet.classList.add(direction === "next" ? "next" : "prev");

      currentPage = nextPage;
      setTimeout(() => renderBook(), 130);
      setTimeout(() => {
        sheet.classList.remove("next", "prev");
        sheet.innerHTML = "";
        isTurning = false;
      }, 540);
    }

    function handlePointerStart(event) {
      startX = event.clientX;
      startY = event.clientY;
    }

    function handlePointerEnd(event) {
      const dx = event.clientX - startX;
      const dy = event.clientY - startY;
      if (Math.abs(dx) < 38 || Math.abs(dx) < Math.abs(dy)) return;
      turn(dx > 0 ? "next" : "prev");
    }

    reader.addEventListener("pointerdown", handlePointerStart);
    reader.addEventListener("pointerup", handlePointerEnd);

    reader.addEventListener("click", (event) => {
      if (Math.abs(event.clientX - startX) > 8) return;
      turn(event.clientX > window.innerWidth / 2 ? "next" : "prev");
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === "PageDown") turn("next");
      if (event.key === "ArrowLeft" || event.key === "PageUp") turn("prev");
    });

    window.addEventListener("resize", () => {
      const nextCompact = isCompact();
      compact = nextCompact;
      clearTimeout(window.resizeTimer);
      window.resizeTimer = setTimeout(renderBook, 140);
    });

    async function start() {
      pdfDoc = await pdfjsLib.getDocument(PDF_FILE).promise;
      await renderBook();
      loader.classList.add("hide");
    }

    start().catch(() => {
      loader.textContent = "Open with local server";
    });
  </script>
</body>
</html>
